- date: '2018-12-23'
  text: 1-3:30pm Guided Canoe/Kayak Trip Join the ranger for a guided canoe trip out to the Eagles Nest.
    The trip is about 3.5 miles roundtripYou can join us for free if you have your own canoe or kayak
    or can rent one for $10/person. If you do need one from here - please call 387-1114 to reserve. Bring
    snacks and a drink. Trip may be cancelled depending on weather.
