- date: '2018-11-24'
  text: 10AM & 2PM Guided Canoe or Kayak Trip Join the ranger for a guided canoe trip out to the Eagles
    Nest. You can join us for free if you have your own canoe or kayak or can rent one for $10/person.
    If you do need one from here - please call 387-1114 to reserve. Bring snacks and a drink. Trip may
    be cancelled depending on weather.
- date: '2018-11-23'
  text: 10AM Black Friday Ranger Hike Get outside for Black Friday and add your tracks along the Edgewater
    Trail. It's our annual Ranger hike and we will be walking about three miles looking for critters and
    birds and enjoying being outside. Great way to walk off that turkey so you can have leftovers later.
- date: '2018-11-23'
  text: 5:30PM Almost Full Moon Walk The moon is still over 99% full so come and join us for a ranger
    walk to watch it rise tonight.
- date: '2018-11-22'
  text: 5pm Full Moon Campfire Thanksgiving is the full moon - rising at about 5:15. Come out and enjoy
    the full moon at the refuge. You can watch it on the pier and then come over to the amphitheater where
    we will have a campfire and hot cocoa and apple cider to enjoy.
