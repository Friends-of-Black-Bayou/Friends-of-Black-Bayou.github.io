  text: 7-9PM The Guardians Movie Showing Chennault Aviation & Military Museum Exclusive showing of the
    2018 documentary "The Guardians". The film is about protecting Monarch butterfly habitat in Mexico.
- date: '2018-06-21'
  text: 7:30-9pm Annual Summer Solstice Paddle Join us on the annual summer solstice paddle to celebrate
    the longest day of the year and to watch the sunset over the lake. If you have your own kayak or canoe
    please join us. If you need to rent one for the evening please call the Visitor Center at 387-1114
    to reserve one $10/person. Bring a beverage and a snack and plenty of bug spray.
  see:
  - /events/annual-summer-solstice-paddle/
- date: '2018-06-20'
  text: Northeast Louisiana Summer Film Series The Northeast Louisiana Arts Council is proud to present
    the first ever Northeast Louisiana Summer Film Series. The film continues June 20 with All Over But
    to Cry. Louisiana’s spirit of survival meets the powers of Hurricane Audrey, the deadliest cyclone
    in American history. The Arts Council partners with Black Bayou Lake National Wildlife Refuge to feature
    this Louisiana-directed and Louisiana-made film. This film is 60 minutes long. All films will be shown
    at 7:30 p.m. at the Flying Tiger Brewery every third Wednesday this summer. Doors open at 4 p.m. Tickets
    for non-members are $5. Arts Council members will receive free tickets. To become a member of the
    Arts Council, visit www.nelaarts.org. Ticket proceeds for All Over But to Cry will benefit the Arts
    Council and Black Bayou. CLICK HERE FOR FLYER
