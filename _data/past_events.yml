- date: '2018-04-16'
  text: '@6:30PM Friends of Black Bayou Meeting Join the Friends of Black Bayou for our monthly meeting,
    help plan for upcoming events and get updates on all the amazing projects at the Refuge! Bring a friend!
    Special Guest Speaker - Adam Rogers, FWS Presentation Title -The Battle for Black Bayou Habitat: A
    spring 2018 presentation on the BBL wildflower project and combat of aquatic invasives by Wildlife
    Refuge Specialist Adam Rogers, aquatic spray boat operator for all of 2017 and wildflower planter
    of almost 7 acres of over 50 species of native wildflowers.'
- date: '2018-04-07'
  text: Great American Cleanup Day Join Friends of Black Bayou as we participate in the 2018 Great American
    Clean-up with our partners at Ouachita Green. Free canoe rentals all day if you retrieve litter on
    the lake while out, and we will provide a free lunch for our morning volunteers who help us hit the
    trails! Meet at the Visitor Center at 9AM for a quick orientation and supply pickup. We will provide
    the tools and trash bags! More information to come! Bring a friend and enjoy the wonderful refuge
    as we make a difference in our community!
