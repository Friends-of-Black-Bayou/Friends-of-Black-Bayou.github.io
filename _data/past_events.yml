- date: '2018-12-21'
  text: 6-7pm Winter Solstice Celebration Join is to celebrate the shortest day of the year and the first
    day of winter. We will have a fire, s’mores, cocoa, and some music. Meet out at the amphitheater.
    The moon will also be practically full that night.
- date: '2018-12-17'
  text: 6:30pm Friends Holiday Party Join the Friends of Black Bayou for our annual Holiday Party! This
    is a great chance to get a recap on the many excellent projects that are happening at the refuge and
    see friends! Bring a friend who might be interested, the more the merrier!
